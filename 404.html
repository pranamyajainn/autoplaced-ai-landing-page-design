<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Autoplaced</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/__CSS__">
<style>
  .nf { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px max(20px, env(safe-area-inset-left, 0px)); text-align: center;
    background: linear-gradient(180deg, #3f8fbf 0%, #9fcfe0 45%, #f1e7c6 72%, #6f9a55 72.4%, #3d6b2a 100%); }
  .nf img { width: 112px; height: auto; margin: 0 auto 20px; filter: drop-shadow(0 16px 20px rgba(8, 36, 40, .28)); }
  .nf h1 { font-size: clamp(36px, 7vw, 64px); line-height: 1; letter-spacing: -.045em; font-weight: 620; color: #0c2a2d; text-wrap: balance; }
  .nf p { margin: 16px auto 0; max-width: 420px; font-size: 17px; color: #2f4b4d; }
  .nf .hero__ctas { animation: none; }
</style>
</head>
<body>
<main class="nf">
  <div>
    <img src="/assets/bot.png" alt="" width="112" height="106">
    <h1>This page wandered off the path.</h1>
    <p>The link may be old or mistyped. The homepage is right this way.</p>
    <div class="hero__ctas"><a class="btn btn--ink btn--lg" href="/">Back to the homepage</a></div>
  </div>
</main>
</body>
</html>
