<!doctype html>
<!-- Renders the 1200x630 social share image from the real hero. Not linked from the site; screenshot it to assets/og.jpg when window.ready is true. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autoplaced share image</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f7f5ef; }
  iframe { display: block; border: 0; width: 1200px; height: 630px; }
</style>
</head>
<body>
<iframe src="index.html" title="Autoplaced hero"></iframe>
<script>
  const frame = document.querySelector('iframe');
  frame.addEventListener('load', () => {
    const style = frame.contentDocument.createElement('style');
    style.textContent = `
      .nav, .dock, .gift__ui, .gift__bubble, .hero__sub { display: none !important; }
      .hero { padding: 40px 64px 0 !important; }
      .hero__grid { min-height: 590px !important; grid-template-columns: 1fr 1fr !important; }
      .hero__title { font-size: 92px !important; }
      .gift { --gh: 600px !important; --by: 55% !important; }
      .gift__dust { display: none; }`;
    frame.contentDocument.head.appendChild(style);
    setTimeout(() => { window.ready = true; }, 2800);
  });
</script>
</body>
</html>
